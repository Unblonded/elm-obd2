; CLS Live firmware for Waveshare ESP32-C6-Touch-LCD-1.47
; Build + flash:  cd firmware && pio run -t upload && pio device monitor
[env:esp32c6]
; ESP32-C6 needs Arduino core 3.x -> community "pioarduino" platform
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
lib_deps =
  https://github.com/moononournation/Arduino_GFX.git#v1.6.0
  https://github.com/h2zero/NimBLE-Arduino.git#2.3.2
